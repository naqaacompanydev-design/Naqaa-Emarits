<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(s, c){ return (c || document).querySelector(s); };
  var $$ = function(s, c){ return Array.prototype.slice.call((c || document).querySelectorAll(s)); };

  /* header, progress bar, floating bar */
  var hdr = $('#hdr'), prog = $('#progress'), fbar = $('#fbar'), ticking = false;
  function onScroll(){
    var y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    hdr.classList.toggle('solid', y > 30);
    prog.style.transform = 'scaleX(' + (h > 0 ? y / h : 0) + ')';
    fbar.classList.toggle('show', y > innerHeight * .6);
    ticking = false;
  }
  addEventListener('scroll', function(){ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, {passive:true});
  onScroll();

  /* mobile menu */
  var burger = $('#burger');
  function menu(open){
    document.body.classList.toggle('menu-open', open);
    burger.setAttribute('aria-expanded', open);
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function(){ menu(!document.body.classList.contains('menu-open')); });
  $$('#menu a').forEach(function(a){ a.addEventListener('click', function(){ menu(false); }); });
  document.addEventListener('click', function(e){ if(document.body.classList.contains('menu-open') && !e.target.closest('#menu') && !e.target.closest('#burger')) menu(false); });

  /* headline: word by word */
  var h1 = $('#h1');
  if(!reduce){
    var n = 0;
    (function split(node){
      Array.prototype.slice.call(node.childNodes).forEach(function(ch){
        if(ch.nodeType === 3){
          var frag = document.createDocumentFragment();
          ch.textContent.split(/(\s+)/).forEach(function(part){
            if(!part) return;
            if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
            var s = document.createElement('span'); s.className = 'w'; s.textContent = part;
            s.style.animationDelay = (0.15 + n++ * 0.12) + 's'; frag.appendChild(s);
          });
          node.replaceChild(frag, ch);
        } else if(ch.nodeType === 1){ split(ch); }
      });
    })(h1);
  }

  /* counters */
  function count(el){
    var to = parseFloat(el.dataset.to), dec = +el.dataset.dec || 0, t0 = null, dur = 1600;
    if(reduce){ el.textContent = to.toFixed(dec); return; }
    (function step(t){
      if(!t0) t0 = t;
      var p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = dec ? (to * e).toFixed(dec) : Math.round(to * e).toLocaleString('en-US');
      if(p < 1) requestAnimationFrame(step);
    })(performance.now());
  }
  setTimeout(function(){ $$('[data-to]').forEach(count); }, 1100);

  /* reveal on scroll */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target); } });
  }, {threshold:.12, rootMargin:'0px 0px -40px 0px'});
  $$('.rv-in').forEach(function(el){ io.observe(el); });

  /* logo marquee: duplicate once for a seamless loop */
  var mq = $('#marq');
  if(mq) $$('li', mq).forEach(function(li){ var c = li.cloneNode(true); c.setAttribute('aria-hidden', 'true'); mq.appendChild(c); });

  /* coverage radar dots (spread over the whole city) */
  var g = $('#dots'), NS = 'http://www.w3.org/2000/svg';
  var pts = [[128,92],[262,86],[200,58],[318,150],[90,168],[300,262],[150,300],[240,322],[340,210],[62,236],[172,140],[248,158],[132,228],[270,212],[205,262],[110,120],[292,110],[88,286],[330,300],[198,352],[160,190],[236,112]];
  pts.forEach(function(p, i){
    var d = document.createElementNS(NS, 'circle'); d.setAttribute('class','dot'); d.setAttribute('cx',p[0]); d.setAttribute('cy',p[1]); d.setAttribute('r',3.2); g.appendChild(d);
    var r = document.createElementNS(NS, 'circle'); r.setAttribute('class','pulse'); r.setAttribute('cx',p[0]); r.setAttribute('cy',p[1]); r.setAttribute('r',4);
    r.style.animationDelay = (i * 0.37 % 3).toFixed(2) + 's'; g.appendChild(r);
  });

  /* spotlight hover */
  $$('.spot').forEach(function(el){
    el.addEventListener('pointermove', function(e){ var b = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - b.left) + 'px'); el.style.setProperty('--my', (e.clientY - b.top) + 'px'); });
  });

  /* how it works */
  var steps = $$('#steps .step'), track = $('#howTrack'), si = 0, st = null;
  function stepShow(k){
    steps.forEach(function(s, j){ s.classList.toggle('done', j < k); s.classList.toggle('on', j === k); });
    track.style.setProperty('--p', Math.min(k, steps.length - 1) / (steps.length - 1) * 100 + '%');
  }
  if(reduce){ stepShow(steps.length); }
  else new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting && !st){ $('#steps').classList.add('run'); si = 0; (function tick(){ stepShow(si); var w = si === steps.length - 1 ? 3200 : 2000; si = (si + 1) % steps.length; st = setTimeout(tick, w); })(); }
      else if(!e.isIntersecting && st){ clearTimeout(st); st = null; }
    });
  }, {threshold:.35}).observe($('#steps'));

  /* reviews arrows */
  var row = $('#rvRow');
  if(row){
  function slide(dir){ var c = $('.rv', row); row.scrollBy({left: dir * (c.offsetWidth + 14), behavior:'smooth'}); }
  $('#rvNext').addEventListener('click', function(){ slide(1); });
  $('#rvPrev').addEventListener('click', function(){ slide(-1); });
  }

  /* booking form -> WhatsApp */
  $('#fSend').addEventListener('click', function(){
    var nameEl = $('#f-name'), fg = nameEl.closest('.fg'), name = nameEl.value.trim();
    if(name.length < 2){ fg.classList.add('has-err'); $('#f-name-err').textContent = 'Please enter your name'; nameEl.focus(); return; }
    fg.classList.remove('has-err');
    var area = $('#f-area').value.trim(), service = $('#f-service').value || 'General enquiry', msg = $('#f-msg').value.trim();
    var t = 'Hello, my name is ' + name + '\nService: ' + service;
    if(area) t += '\nArea: ' + area;
    if(msg) t += '\nDetails: ' + msg;
    if(window.naqaaTrack) naqaaTrack('ضغطة_واتساب', {link_location:'فورم الحجز', link_text:'فورم الحجز'});
    window.open('https://wa.me/{{WA}}?text=' + encodeURIComponent(t), '_blank');
  });

  /* footer */
  $('#yr').textContent = new Date().getFullYear();
  var credit = $('#credit'), pop = $('#creditPop');
  credit.addEventListener('click', function(e){ e.stopPropagation(); pop.classList.toggle('show'); });
  document.addEventListener('click', function(){ pop.classList.remove('show'); });
})();
</script>
<script id="nq-home-anim-js">
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  /* 1 counters pop when they land (page counts start ~1.1s and run 1.6s) */
  setTimeout(function () { $$('#stats .stat b').forEach(function (b, i) { setTimeout(function () { b.classList.add('pop'); }, i * 120); }); }, 2750);
  /* 6 stars: wrap each ★ so they can fill one by one */
  $$('.rv .st, .g-badge .st').forEach(function (st) {
    st.classList.add('ha-st'); var k = 0;
    Array.prototype.slice.call(st.childNodes).forEach(function (n) {
      if (n.nodeType !== 3) return;
      var f = document.createDocumentFragment();
      n.textContent.split('').forEach(function (c) { if (c !== '★') { f.appendChild(document.createTextNode(c)); return; } var i = document.createElement('i'); i.textContent = c; i.style.setProperty('--i', k++); f.appendChild(i); });
      st.replaceChild(f, n);
    });
  });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('ha-lit'); io.unobserve(e.target); } }); }, { threshold: .25 });
    $$('#reviews .head, #rvRow .rv').forEach(function (el) { io.observe(el); });
  } else $$('.ha-st').forEach(function (s) { s.parentNode.classList.add('ha-lit'); });
  /* 9 why icons: let every stroke draw itself */
  $$('.fcard .ic svg *').forEach(function (p) { if (p.tagName !== 'svg') p.setAttribute('pathLength', '100'); });
})();
</script>
<script id="nq-home-anim2-js">
(function(){
  var d = document, $ = function (s) { return d.querySelector(s); }, $$ = function (s) { return Array.prototype.slice.call(d.querySelectorAll(s)); };
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, en = d.documentElement.lang === 'en';
  /* 1 progress bar + 10 back to top */
  var prog = d.createElement('div'); prog.id = 'ha-prog'; d.body.appendChild(prog);
  var top = d.createElement('button'); top.id = 'ha-top'; top.type = 'button'; top.setAttribute('aria-label', en ? 'Back to top' : 'ارجع لفوق');
  top.innerHTML = '<svg viewBox="0 0 46 46" aria-hidden="true"><circle class="bg" cx="23" cy="23" r="21"/><circle class="fg" cx="23" cy="23" r="21"/></svg><b aria-hidden="true">↑</b>';
  d.body.appendChild(top);
  var ring = top.querySelector('.fg');
  top.addEventListener('click', function () { scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
  /* 2 bottom bar hide/show + 5 parallax, all in one rAF */
  var fbar = $('#fbar'), slides = $('.hero .slides'), hero = $('.hero'), lastY = scrollY, busy = false, phone = matchMedia('(max-width: 899px)');
  function frame() {
    busy = false;
    var y = scrollY, h = d.documentElement.scrollHeight - innerHeight, p = h > 0 ? y / h : 0;
    prog.style.transform = 'scaleX(' + p + ')';
    ring.style.strokeDashoffset = (132 - 132 * p).toFixed(1);
    top.classList.toggle('on', y > innerHeight * 1.2);
    if (slides && !reduce && y < (hero ? hero.offsetHeight : innerHeight)) slides.style.transform = 'translate3d(0,' + (y * .35).toFixed(1) + 'px,0)';
    lastY = y;
  }
  addEventListener('scroll', function () { if (!busy) { busy = true; requestAnimationFrame(frame); } }, { passive: true });
  frame();
  if (reduce) return;
  /* 3 gold ripple on buttons */
  d.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('.btn,.fbar a');
    if (!b) return;
    var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), sp = d.createElement('span');
    sp.className = 'ha-rip'; sp.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + (e.clientX - r.left - s / 2) + 'px;top:' + (e.clientY - r.top - s / 2) + 'px';
    if (getComputedStyle(b).position === 'static') b.style.position = 'relative';
    b.appendChild(sp); setTimeout(function () { sp.remove(); }, 650);
  }, { passive: true });
  /* 4 swipe hint once, only where the row really scrolls */
  if ('IntersectionObserver' in window) {
    var hint = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return; hint.unobserve(e.target);
        if (e.target.scrollWidth > e.target.clientWidth + 20) { e.target.classList.add('ha-nudge'); setTimeout(function () { e.target.classList.remove('ha-nudge'); }, 2000); }
      });
    }, { threshold: .6 });
    $$('.pk-grid, #rvRow').forEach(function (el) { hint.observe(el); });
    /* 9 logos: the one passing the middle is in colour */
    var marq = $('.marq'), lis = $$('.marq li'), tick = null;
    if (marq) {
      var pick = function () {
        var r = marq.getBoundingClientRect(), c = r.left + r.width / 2;
        lis.forEach(function (li) { var b = li.getBoundingClientRect(); li.classList.toggle('ha-mid', Math.abs(b.left + b.width / 2 - c) < b.width * .75); });
      };
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) { if (!tick) { pick(); tick = setInterval(pick, 200); } }
        else if (tick) { clearInterval(tick); tick = null; }
      }).observe(marq);
    }
  }
  /* 7 FAQ: smooth open/close */
  $$('.faq details').forEach(function (det) {
    var sum = det.querySelector('summary'), ans = det.querySelector('.ans');
    if (!sum || !ans || !ans.animate) return;
    sum.addEventListener('click', function (e) {
      e.preventDefault();
      if (det.dataset.busy) return; det.dataset.busy = 1;
      if (!det.open) {
        det.open = true;
        var h = ans.offsetHeight, pb = getComputedStyle(ans).paddingBottom;
        ans.animate([{ height: '0px', paddingBottom: '0px', opacity: 0 }, { height: h + 'px', paddingBottom: pb, opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.22,1,.36,1)' }).onfinish = function () { delete det.dataset.busy; };
      } else {
        var a = ans.animate([{ height: ans.offsetHeight + 'px', paddingBottom: getComputedStyle(ans).paddingBottom, opacity: 1 }, { height: '0px', paddingBottom: '0px', opacity: 0 }], { duration: 300, easing: 'ease-in' });
        a.onfinish = function () { det.open = false; delete det.dataset.busy; };
      }
    });
  });
  /* 8 form: green "done" when the WhatsApp message opens, shake when the name is missing */
  var send = $('#fSend');
  if (send) send.addEventListener('click', function () {
    setTimeout(function () {
      var bad = d.querySelector('.form .has-err');
      if (bad) { send.classList.remove('ha-shake'); void send.offsetWidth; send.classList.add('ha-shake'); return; }
      var t = send.textContent; send.classList.add('ha-ok'); send.textContent = en ? '✓ Opening WhatsApp' : '✓ جاهز، نكمل على واتساب';
      setTimeout(function () { send.classList.remove('ha-ok'); send.textContent = t; }, 2600);
    }, 30);
  });
})();
</script>
<script id="nq-home-anim3-js">
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var d = document, en = true;
  /* ---------- logos: keep moving on their own, but the visitor can swipe or drag them both ways ---------- */
  var mq = d.querySelector('.marq'), mul = mq && mq.querySelector('ul');
  if (mq && mul) {
    mq.classList.add('ha-free');
    var paused = 0, half = function () { return mul.scrollWidth / 2; }, pos = 0, hold = function () { paused = Date.now() + 2500; };
    ['touchstart', 'wheel', 'pointerdown'].forEach(function (ev) { mq.addEventListener(ev, hold, { passive: true }); });
    mq.addEventListener('scroll', function () { if (Date.now() < paused) hold(); }, { passive: true });
    var dragX = null, dragS = 0;
    mq.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') return; dragX = e.clientX; dragS = mq.scrollLeft; mq.classList.add('drag'); });
    addEventListener('pointermove', function (e) { if (dragX === null) return; var h = half(), t = dragS - (e.clientX - dragX); while (t < 2) t += h; while (t > 2 * h - mq.clientWidth - 2) t -= h; mq.scrollLeft = t; hold(); });
    addEventListener('pointerup', function () { dragX = null; mq.classList.remove('drag'); });
    var wrap = function () { var h = half(); if (h <= 0) return; if (mq.scrollLeft >= 2 * h - mq.clientWidth - 2) mq.scrollLeft -= h; else if (mq.scrollLeft <= 2) mq.scrollLeft += h; };
    mq.addEventListener('scroll', wrap, { passive: true });
    setTimeout(function () { mq.scrollLeft = half(); pos = mq.scrollLeft; }, 60);
    (function run() {
      if (Date.now() > paused && mq.getBoundingClientRect().bottom > 0 && mq.getBoundingClientRect().top < innerHeight) { pos = (Math.abs(pos - mq.scrollLeft) > 3 ? mq.scrollLeft : pos) + .6; mq.scrollLeft = pos; }
      requestAnimationFrame(run);
    })();
  }
  /* ---------- 4: word strips, faster while scrolling ---------- */
  var strips = Array.prototype.slice.call(d.querySelectorAll('.ha-strip')), vel = 0, lastY = scrollY, live = new Set();
  addEventListener('scroll', function () { var y = scrollY; vel += Math.abs(y - lastY) * .35; lastY = y; }, { passive: true });
  strips.forEach(function (s, i) { s._x = 0; s._dir = i % 2 ? 1 : -1; s._tr = s.querySelector('.tr'); });
  if ('IntersectionObserver' in window) {
    var sio = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) live.add(e.target); else live.delete(e.target); }); });
    strips.forEach(function (s) { sio.observe(s); });
  } else strips.forEach(function (s) { live.add(s); });
  (function loop() {
    vel *= .9; var sp = .6 + Math.min(vel, 40);
    live.forEach(function (s) { var w = s._tr.scrollWidth / 4; s._x += sp * s._dir; if (s._x <= -w) s._x += w; if (s._x >= 0 && s._dir > 0) s._x -= w; s._tr.style.transform = 'translate3d(' + s._x.toFixed(1) + 'px,0,0)'; });
    requestAnimationFrame(loop);
  })();
})();
</script>
