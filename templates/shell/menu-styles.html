<style id="nq-soc-css">
.nq-soc{display:flex;flex-direction:column;align-items:center;gap:8px;margin:2px 0 16px}
.nq-soc-l{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;color:#e4bf6a;letter-spacing:.4px}
.nq-soc-l::before,.nq-soc-l::after{content:'';width:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(228,191,106,.6),transparent)}
.nq-soc-i{display:flex;gap:10px;justify-content:center}
.nq-soc-i>*{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff!important;background:var(--bg);box-shadow:0 0 0 1.5px rgba(228,191,106,.55);text-decoration:none!important;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;animation:nqSocIn .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*90ms)}
.nq-soc-i svg{width:17px;height:17px;position:relative;z-index:1}
.nq-soc-i>*::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 72%,rgba(245,217,142,.95));opacity:0;animation:nqSocRing 7.5s linear infinite;animation-delay:calc(var(--i)*1.5s);-webkit-mask:radial-gradient(circle,transparent 64%,#000 66%);mask:radial-gradient(circle,transparent 64%,#000 66%);pointer-events:none}
.nq-soc-i a:hover,.nq-soc-i a:focus-visible{transform:translateY(-4px) scale(1.1);box-shadow:0 0 0 1.5px #f5d98e,0 8px 18px -6px var(--sh)}
.nq-soc .s-snap{--bg:#fffc00;--sh:rgba(255,252,0,.7);color:#111!important}
.nq-soc .s-insta{--bg:radial-gradient(circle at 30% 110%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285aeb 90%);--sh:rgba(214,36,159,.7)}
.nq-soc .s-tiktok{--bg:#010101;--sh:rgba(37,244,238,.6)}
.nq-soc .s-x{--bg:#000;--sh:rgba(255,255,255,.45)}
.nq-soc .s-yt{--bg:#ff0000;--sh:rgba(255,0,0,.6)}
@keyframes nqSocIn{from{opacity:0;transform:translateY(12px) scale(.6)}to{opacity:1;transform:none}}
@keyframes nqSocRing{0%,82%{opacity:0;transform:rotate(0)}86%{opacity:1}100%{opacity:0;transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.nq-soc-i>*,.nq-soc-i>*::after{animation:none}}
</style>
<style id="nq-pbtn">
#fbar .p,#nq-fbar .p{background:linear-gradient(135deg,#c9a84c,#e4bf6a 60%,#f5d98e);color:#1a1405!important;font-weight:900}
#fbar .p svg,#nq-fbar .p svg{width:19px;height:19px}
@media(max-width:899px){#fbar a,#nq-fbar a{font-size:14px!important;gap:6px!important;padding:0 4px!important}#fbar .p,#nq-fbar .p{flex:1.15!important}}
@media(max-width:359px){#fbar a,#nq-fbar a{font-size:12.5px!important}#fbar svg,#nq-fbar svg{width:17px!important;height:17px!important}}
@media(prefers-reduced-motion:no-preference){#fbar .p svg,#nq-fbar .p svg{animation:nqCalc 5s ease-in-out 2s infinite}}
@keyframes nqCalc{0%,88%,100%{transform:none}91%{transform:translateY(-3px) rotate(-8deg)}94%{transform:translateY(0) rotate(6deg)}}
</style>
<style id="nq-mm">
.mm{position:static;display:flex;align-items:center}
.mm-t{display:inline-flex!important;align-items:center;gap:6px}
.mm-t i,.mm-m summary i{width:7px;height:7px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-2px);transition:transform .3s}
.mm:hover .mm-t i,.mm:focus-within .mm-t i{transform:rotate(135deg) translateY(-2px)}
.mm-p{position:absolute;top:100%;left:50%;width:min(980px,94vw);transform:translate(-50%,12px);opacity:0;visibility:hidden;transition:opacity .25s,transform .35s cubic-bezier(.22,1,.36,1),visibility .25s;background:rgba(9,20,36,.98);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(201,168,76,.28);border-top:0;border-radius:0 0 24px 24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.85);padding:22px 24px 18px;z-index:1300;text-align:right}
.mm:hover .mm-p,.mm:focus-within .mm-p{opacity:1;visibility:visible;transform:translate(-50%,0)}
.mm-gs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 22px}
.mm-g{display:flex;flex-direction:column}
.mm-gt{display:flex;align-items:center;gap:8px;font:900 15px Cairo,sans-serif;color:#e4bf6a;padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid rgba(201,168,76,.18)}
.mm-gt span{font-size:18px}
#hdr .mm-p a,#nq-hdr .mm-p a{display:block;font-size:14.5px!important;font-weight:700;color:rgba(248,246,240,.86)!important;padding:7px 0!important;white-space:normal;text-decoration:none!important;transition:color .2s,transform .2s}
#hdr .mm-p a::after,#nq-hdr .mm-p a::after{display:none!important}
#hdr .mm-p a:hover,#nq-hdr .mm-p a:hover{color:#f5d98e!important;transform:translateX(-4px)}
.mm-q{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(201,168,76,.18)}
#hdr .mm-q a,#nq-hdr .mm-q a,.mm-m .mm-q a{display:inline-flex!important;align-items:center;height:38px;padding:0 16px!important;border-radius:50px;border:1px solid rgba(201,168,76,.35);font-size:14px!important;font-weight:800;color:#f5d98e!important;text-decoration:none!important;transform:none!important}
#hdr .mm-q a.g,#nq-hdr .mm-q a.g,.mm-m .mm-q a.g{background:linear-gradient(135deg,#c9a84c,#e4bf6a 60%,#f5d98e);color:#1a1405!important;border:0}
#hdr .mm-q a.all,#nq-hdr .mm-q a.all,.mm-m .mm-q a.all{margin-inline-start:auto;border:0}
/* phone menu */
.mm-m{width:100%;border-bottom:1px solid rgba(201,168,76,.08)}
.mm-m summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:#f8f6f0;padding:12px 0}
#menu .mm-m summary{font-size:26px}#nq-menu .mm-m summary{font-size:20px}
.mm-m summary::-webkit-details-marker{display:none}
.mm-m[open] summary{color:#e4bf6a}.mm-m[open] summary i{transform:rotate(135deg) translateY(-2px)}
.mm-mb{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:4px 2px 14px;text-align:right;max-height:52vh;overflow:auto}
.mm-mb .mm-gt{font-size:14px}
#menu .mm-mb a,#nq-menu .mm-mb a{display:block;width:auto!important;font-size:14px!important;font-weight:700;color:rgba(248,246,240,.86)!important;padding:6px 0!important;border:0!important;opacity:1!important;transform:none!important;text-align:right!important}
.mm-mb .mm-q{grid-column:1/-1;justify-content:center;margin-top:4px}
.mm-mb .mm-q a.all{margin-inline-start:0!important}
#menu:has(.mm-m[open]){justify-content:flex-start;overflow:auto}
@media(max-width:899px){.mm-p{display:none}}
</style>
